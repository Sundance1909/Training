<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training log</title>
<meta name="theme-color" content="#12171E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#18202B; --muted:#5B6675; --line:#D5DBE2;
  --plate:#F2B705; --plate-ink:#241B00; --good:#2F8F5B; --warn:#C0552B;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12171E; --surface:#1C232D; --ink:#E9EDF2; --muted:#98A3B1; --line:#2E3845;
    --plate:#F5C22A; --plate-ink:#1E1600; --good:#4CB67C; --warn:#E07A4E;
  }
}
:root[data-theme="dark"]{
  --bg:#12171E; --surface:#1C232D; --ink:#E9EDF2; --muted:#98A3B1; --line:#2E3845;
  --plate:#F5C22A; --plate-ink:#1E1600; --good:#4CB67C; --warn:#E07A4E;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--plate);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 140px}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;padding:10px 16px 8px;max-width:560px;margin:0 auto}
nav.tabs button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:8px;font-weight:600;color:var(--muted)}
nav.tabs button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}

header.session{padding:14px 0 10px}
.session h1{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;margin:0;letter-spacing:.2px}
.session p{margin:6px 0 0;color:var(--muted);font-size:15px}
.picker{display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap}
.seg{display:flex;background:var(--surface);border-radius:10px;padding:3px;box-shadow:inset 0 0 0 1px var(--line)}
.seg button{border:0;background:transparent;min-width:38px;height:36px;border-radius:8px;font-family:var(--display);font-weight:600;font-size:19px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button.done:not([aria-pressed="true"]){color:var(--good)}

ol.ex{list-style:none;margin:8px 0 0;padding:0}
.ex li{background:var(--surface);border-radius:14px;padding:14px 14px 12px;margin-bottom:10px;box-shadow:inset 0 0 0 1px var(--line)}
.ex li.complete{box-shadow:inset 0 0 0 2px var(--good)}
.row1{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.name{font-weight:600;font-size:18px}
.name small{display:block;font-weight:500;font-size:14px;color:var(--muted)}
.heavy-tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--plate);color:var(--plate-ink);margin-left:6px;vertical-align:2px}
.weight{font-family:var(--display);font-weight:700;font-size:48px;line-height:.9;font-variant-numeric:tabular-nums}
.sets{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.set{width:52px;height:52px;border-radius:50%;border:3px solid var(--plate);background:transparent;font-family:var(--display);font-weight:700;font-size:20px;display:grid;place-items:center;line-height:1;position:relative;touch-action:manipulation}
.set.done{background:var(--plate);color:var(--plate-ink)}
.set.short{background:transparent;border-color:var(--warn);color:var(--warn)}
.set .alt{position:absolute;bottom:-18px;font-size:12px;font-family:var(--body);font-weight:600;color:var(--muted);white-space:nowrap}
.set.done .alt,.set.short .alt{color:var(--muted)}
.hint{color:var(--muted);font-size:14px;margin:4px 2px 12px}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.timer{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.timer .clock{font-family:var(--display);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums;min-width:62px}
.timer .bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--plate);width:0}
.timer.idle .clock{color:var(--muted)}
.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:600;background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.small{padding:8px 12px;font-size:15px}
.btn:disabled{opacity:.45}

dialog{border:0;border-radius:18px;padding:20px;background:var(--surface);color:var(--ink);width:min(92vw,380px)}
dialog::backdrop{background:rgba(10,14,20,.55)}
dialog h2{font-family:var(--display);font-size:28px;margin:0 0 4px}
dialog p{margin:0 0 14px;color:var(--muted);font-size:15px}
.stepper{display:flex;align-items:center;justify-content:space-between;margin:10px 0}
.stepper span.lbl{font-weight:600}
.stepper .ctl{display:flex;align-items:center;gap:8px}
.stepper button{width:48px;height:48px;border-radius:12px;border:0;background:var(--bg);font-size:26px;font-weight:600}
.stepper output{font-family:var(--display);font-weight:700;font-size:34px;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

h2.sec{font-family:var(--display);font-size:32px;margin:18px 0 6px}
.card{background:var(--surface);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:inset 0 0 0 1px var(--line)}
.card h3{margin:0 0 6px;font-size:17px}
.card .meta{color:var(--muted);font-size:14px;margin-bottom:8px}
.hist-line{display:flex;justify-content:space-between;gap:10px;font-size:15px;padding:3px 0;border-top:1px solid var(--line)}
.hist-line:first-of-type{border-top:0}
.hist-line .r{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.hist-line .r.miss{color:var(--warn)}
.empty{color:var(--muted);padding:20px 0}

.max-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.max-row:first-child{border-top:0}
.max-row input{width:92px;font:600 22px var(--display);text-align:right;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.max-row .sugg{font-size:13px;color:var(--muted);display:block}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.field select{font:inherit;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.status{font-size:13px;color:var(--muted);margin-top:18px}
.banner{background:var(--plate);color:var(--plate-ink);border-radius:14px;padding:14px;margin:8px 0 12px}
.banner h3{margin:0 0 4px;font-family:var(--display);font-size:24px}
.banner p{margin:0 0 10px}
.banner .btn{background:var(--plate-ink);color:var(--plate)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.seg{overflow-x:auto;max-width:100%}
.picker .seg:first-child{flex:0 1 auto}
.apply{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:15px}
.apply input{width:22px;height:22px;accent-color:var(--plate)}
.plan-sec{margin-bottom:18px}
.wk-row,.lib-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.wk-row:first-child,.lib-row:first-child{border-top:0}
.wk-row .lbl{flex:1;font-weight:600}
.num{width:76px;font:600 20px var(--display);text-align:right;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.num.sm{width:50px;text-align:center;padding:6px 4px}
.txt{flex:1;min-width:0;font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.day-card h3{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-size:26px;margin:0 0 6px}
.it-row{border-top:1px solid var(--line);padding:10px 0}
.it-row:first-of-type{border-top:0}
.it-top{display:flex;gap:8px;align-items:center}
.it-top select{flex:1;min-width:0;font:inherit;font-weight:600;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.it-bot{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:nowrap}
.it-bot .x{color:var(--muted)}
.icon{width:38px;height:38px;flex:none;border-radius:10px;border:0;background:var(--bg);font-size:18px;font-weight:600;display:grid;place-items:center}
.icon:disabled{opacity:.35}
.heavy-btn{border:0;border-radius:99px;padding:7px 12px;font-size:14px;font-weight:600;background:var(--bg);color:var(--muted)}
.heavy-btn[aria-pressed="true"]{background:var(--plate);color:var(--plate-ink)}
.spacer{flex:1}
.addrow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--ink);color:var(--bg);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.savebar .in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.savebar span{flex:1;font-weight:600}
.savebar .btn{background:var(--plate);color:var(--plate-ink)}
.savebar .btn.ghost{background:transparent;color:var(--bg);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}
</style>
</head>
<body>
<nav class="tabs" aria-label="Sections">
  <button data-tab="today" aria-current="true">Today</button>
  <button data-tab="history">History</button>
  <button data-tab="plan">Plan</button>
</nav>
<main class="wrap" id="app"></main>

<div class="dock" id="dock">
  <div class="dock-in">
    <div class="timer idle" id="timer" aria-live="polite">
      <span class="clock" id="clock">1:30</span>
      <span class="bar"><i id="bar"></i></span>
      <button class="btn ghost small" id="timerBtn">Start rest</button>
    </div>
    <button class="btn" id="finishBtn">Finish</button>
  </div>
</div>

<dialog id="setDlg">
  <h2 id="dlgTitle">Set</h2>
  <p id="dlgSub"></p>
  <div class="stepper"><span class="lbl">Reps</span><span class="ctl"><button data-d="r" data-v="-1" aria-label="Fewer reps">−</button><output id="dlgReps">10</output><button data-d="r" data-v="1" aria-label="More reps">+</button></span></div>
  <div class="stepper"><span class="lbl">Weight</span><span class="ctl"><button data-d="w" data-v="-1" aria-label="Less weight">−</button><output id="dlgW">0</output><button data-d="w" data-v="1" aria-label="More weight">+</button></span></div>
  <p class="note">The next sets of this exercise start at the weight you save here.</p>
  <div class="dlg-actions">
    <button class="btn ghost" id="dlgClear">Clear set</button>
    <button class="btn" id="dlgSave">Save</button>
  </div>
</dialog>

<script>
(() => {
"use strict";
/* ---------- defaults (original spreadsheet plan) ---------- */
const DEFAULT_MAX={"LP":150,"Leg Extension":110,"Chest Press":90,"Shoulder":30,"Triceps":50,"LC":125,"Row":95,"Lat Pulldown":95,"Biceps":30,"Chest Fly":80};
const T=(ex,heavy,sets,reps)=>({ex,heavy:!!heavy,sets,reps});
function defaultProgram(){
  return {
    ramp:[85,95,100,105,110],
    heavy:120,
    step:5,
    days:[
      {key:"A",items:[T("LP",1,2,5),T("LP",0,2,10),T("Leg Extension",0,3,10),T("Chest Press",0,4,10),T("Shoulder",0,3,10),T("Triceps",0,3,10)]},
      {key:"B",items:[T("LP",0,4,10),T("LC",0,3,10),T("Row",1,2,5),T("Row",0,2,10),T("Lat Pulldown",0,3,10),T("Biceps",0,3,10)]},
      {key:"C",items:[T("Chest Press",1,2,5),T("Chest Press",0,2,10),T("Chest Fly",0,3,10),T("Shoulder",0,3,10),T("Lat Pulldown",1,2,5),T("Lat Pulldown",0,2,10),T("Row",0,3,10)]}
    ]
  };
}
const LS_KEY="peter-gym-v1";
const clone=o=>JSON.parse(JSON.stringify(o));
function freshState(){
  return {v:2,maxes:{...DEFAULT_MAX},program:defaultProgram(),rest:90,cycle:1,week:1,day:"A",logs:{},history:[],updatedAt:0};
}
let S=freshState();
let tab="today";
let draft=null;
let reviewVals=null; // edits on the end-of-cycle review, kept across re-renders // plan editor working copy {program,maxes}

/* ---------- helpers ---------- */
const P=()=>S.program;
const dayKeys=()=>P().days.map(d=>d.key);
const getDay=k=>P().days.find(d=>d.key===k);
const lastWeek=()=>P().ramp.length;
const lastDay=()=>P().days[P().days.length-1].key;
function roundW(x){const st=P().step||5;return Math.round(x/st+1e-6)*st;}
const fmtW=w=>(Math.round(w*10)/10).toString();
function plan(week,dayKey){
  const d=getDay(dayKey);if(!d)return[];
  const pct=P().ramp[week-1]||100;
  return d.items.map((it,i)=>({i,ex:it.ex,heavy:it.heavy,sets:it.sets,reps:it.reps,
    w:roundW((S.maxes[it.ex]||0)*pct/100*(it.heavy?P().heavy/100:1))}));
}
function isDone(w,d){return S.history.some(h=>h.cycle===S.cycle&&h.week===w&&h.day===d)}
function cycleFinished(){return isDone(lastWeek(),lastDay())}
function hasLogs(){return Object.values(S.logs).some(a=>a&&a.some(Boolean))}
function advanceIfDone(){
  // Move to the next session not yet logged this cycle, if the current one is done.
  if(!isDone(S.week,S.day))return;
  const keys=dayKeys();
  for(let w=S.week;w<=lastWeek();w++){
    for(const k of keys){
      if(w===S.week&&keys.indexOf(k)<=keys.indexOf(S.day))continue;
      if(!isDone(w,k)){S.week=w;S.day=k;return;}
    }
  }
}

/* ---------- storage + migration ---------- */
function migrate(o){
  if(!o||typeof o!=="object")return null;
  if(o.v===1){
    // Version 1 had the plan built in. Keep the data and extend the cycle by two weeks.
    o.program=defaultProgram();
    o.program.ramp.push(115,120);
    o.v=2;
  }
  if(o.v!==2||!o.program||!o.maxes)return null;
  return Object.assign(freshState(),o);
}
function loadLocal(){
  try{const raw=localStorage.getItem(LS_KEY);if(raw){const m=migrate(JSON.parse(raw));if(m){S=m;}}}catch(e){}
  if(S.week>lastWeek())S.week=lastWeek();
  if(!getDay(S.day))S.day=dayKeys()[0];
  advanceIfDone();
  save(true);
}
function save(quiet){
  S.updatedAt=Date.now();
  try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){if(!quiet)alert("Couldn't save. Your phone may be out of storage.");}
}

/* ---------- dom helper ---------- */
const app=document.getElementById("app");
function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  if(attrs)for(const k in attrs){
    const v=attrs[k];
    if(k==="class")el.className=v;
    else if(k==="value")el.value=v;
    else if(k.startsWith("on"))el.addEventListener(k.slice(2),v);
    else if(v!==false&&v!=null)el.setAttribute(k,v);
  }
  for(const c of kids.flat()){if(c==null||c===false)continue;el.append(c.nodeType?c:document.createTextNode(c));}
  return el;
}

function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab?"true":"false"));
  document.getElementById("dock").style.display=tab==="today"?"":"none";
  const y=window.scrollY;
  app.replaceChildren();
  if(tab==="today")renderToday();
  else if(tab==="history")renderHistory();
  else renderPlan();
  renderSaveBar();
  return y;
}

/* ---------- today ---------- */
function renderToday(){
  const items=plan(S.week,S.day);
  const already=isDone(S.week,S.day);
  const weeks=P().ramp.map((_,i)=>i+1);
  app.append(h("header",{class:"session"},
    h("h1",null,"Week "+S.week+", day "+S.day),
    h("p",null,"Cycle "+S.cycle+", week "+S.week+" of "+lastWeek()+", at "+P().ramp[S.week-1]+"% of your 10-rep maxes"+(already?". You've logged this one already.":"")),
    h("div",{class:"picker"},
      h("div",{class:"seg",role:"group","aria-label":"Week"},weeks.map(w=>h("button",{"aria-pressed":S.week===w?"true":"false",class:dayKeys().every(d=>isDone(w,d))?"done":"",onclick:()=>switchTo(w,S.day)},String(w)))),
      h("div",{class:"seg",role:"group","aria-label":"Day"},dayKeys().map(d=>h("button",{"aria-pressed":S.day===d?"true":"false",class:isDone(S.week,d)?"done":"",onclick:()=>switchTo(S.week,d)},d)))
    )
  ));
  if(cycleFinished()){
    app.append(h("div",{class:"banner"},h("h3",null,"Cycle "+S.cycle+" done"),h("p",null,"Your results suggest new 10-rep maxes. Check them and start the next cycle."),h("button",{class:"btn",onclick:()=>{tab="plan";render();window.scrollTo(0,0);}},"Review new maxes")));
  }
  app.append(h("p",{class:"hint"},"Tap a circle when you finish a set. Tap it again to change reps or weight."));
  const ol=h("ol",{class:"ex"});
  items.forEach(it=>{
    const l=S.logs[it.i]||[];
    const complete=l.filter(Boolean).length===it.sets;
    const sets=[];
    for(let s=0;s<it.sets;s++){
      const e=l[s];
      let cls="set",label=String(s+1),alt=null;
      if(e){
        cls+=e.r<it.reps?" short":" done";
        label=String(e.r);
        if(e.w!==it.w)alt=h("span",{class:"alt"},"@"+fmtW(e.w));
      }
      sets.push(h("button",{class:cls,"aria-label":"Set "+(s+1)+(e?", "+e.r+" reps at "+fmtW(e.w):", not done"),onclick:()=>tapSet(it,s)},label,alt));
    }
    ol.append(h("li",{class:complete?"complete":""},
      h("div",{class:"row1"},
        h("div",{class:"name"},it.ex,it.heavy?h("span",{class:"heavy-tag"},"heavy"):null,h("small",null,it.sets+" × "+it.reps)),
        h("div",{class:"weight"},fmtW(it.w))
      ),
      h("div",{class:"sets"},sets)
    ));
  });
  app.append(ol);
  updateFinish();
}
function switchTo(w,d){
  if(w===S.week&&d===S.day)return;
  if(hasLogs()&&!confirm("You've logged sets for this workout. Switching clears them. Switch anyway?"))return;
  S.week=w;S.day=d;S.logs={};save();render();
}
function tapSet(it,s){
  const l=S.logs[it.i]||(S.logs[it.i]=[]);
  if(!l[s]){
    // Carry over a weight you changed on an earlier set of the same exercise.
    let w=it.w;for(let k=s-1;k>=0;k--){if(l[k]){w=l[k].w;break;}}
    l[s]={r:it.reps,w};
    save();render();startRest();return;
  }
  openDlg(it,s);
}

/* ---------- set dialog ---------- */
const dlg=document.getElementById("setDlg");
let dlgCtx=null;
function openDlg(it,s){
  const e=S.logs[it.i][s];
  dlgCtx={it,s,r:e.r,w:e.w};
  document.getElementById("dlgTitle").textContent=it.ex+(it.heavy?" (heavy)":"")+", set "+(s+1);
  document.getElementById("dlgSub").textContent="Plan: "+it.reps+" reps at "+fmtW(it.w);
  paintDlg();
  if(dlg.showModal)dlg.showModal();else dlg.setAttribute("open","");
}
function paintDlg(){document.getElementById("dlgReps").textContent=dlgCtx.r;document.getElementById("dlgW").textContent=fmtW(dlgCtx.w);}
dlg.addEventListener("click",ev=>{
  const b=ev.target.closest("button[data-d]");
  if(b&&dlgCtx){
    const dir=+b.dataset.v;
    if(b.dataset.d==="r")dlgCtx.r=Math.max(0,dlgCtx.r+dir);
    else dlgCtx.w=Math.max(0,Math.round((dlgCtx.w+dir*(P().step||5))*10)/10);
    paintDlg();return;
  }
  if(ev.target===dlg)dlg.close();
});
document.getElementById("dlgSave").onclick=()=>{
  const {it,s,r,w}=dlgCtx;const l=S.logs[it.i];
  l[s]={r,w};
  save();dlg.close();render();
};
document.getElementById("dlgClear").onclick=()=>{S.logs[dlgCtx.it.i][dlgCtx.s]=null;save();dlg.close();render();};

/* ---------- finish ---------- */
const finishBtn=document.getElementById("finishBtn");
function updateFinish(){finishBtn.disabled=!hasLogs();}
finishBtn.onclick=()=>{
  const items=plan(S.week,S.day);
  const missing=items.reduce((n,it)=>n+it.sets-((S.logs[it.i]||[]).slice(0,it.sets).filter(Boolean).length),0);
  if(missing>0&&!confirm(missing+" set"+(missing>1?"s are":" is")+" not ticked. Save the workout anyway?"))return;
  const entry={cycle:S.cycle,week:S.week,day:S.day,date:new Date().toISOString(),pct:P().ramp[S.week-1],
    exercises:items.map(it=>({ex:it.ex,heavy:it.heavy,reps:it.reps,sets:it.sets,w:it.w,log:(S.logs[it.i]||[]).slice(0,it.sets).map(e=>e?{r:e.r,w:e.w}:null)}))};
  S.history=S.history.filter(x=>!(x.cycle===entry.cycle&&x.week===entry.week&&x.day===entry.day));
  S.history.push(entry);
  S.logs={};
  advanceIfDone();
  stopRest();save();render();window.scrollTo(0,0);
};

/* ---------- rest timer ---------- */
let restEnd=0,restTick=null;
const timerEl=document.getElementById("timer"),clock=document.getElementById("clock"),bar=document.getElementById("bar"),timerBtn=document.getElementById("timerBtn");
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function paintTimer(){
  if(!restEnd){timerEl.classList.add("idle");clock.textContent=fmt(S.rest);bar.style.width="0";timerBtn.textContent="Start rest";return;}
  const left=Math.max(0,Math.ceil((restEnd-Date.now())/1000));
  timerEl.classList.remove("idle");clock.textContent=fmt(left);
  bar.style.width=(100*(1-left/S.rest))+"%";timerBtn.textContent="Stop";
  if(left<=0){stopRest();clock.textContent="Go";try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}}
}
function startRest(){restEnd=Date.now()+S.rest*1000;clearInterval(restTick);restTick=setInterval(paintTimer,250);paintTimer();}
function stopRest(){restEnd=0;clearInterval(restTick);paintTimer();}
timerBtn.onclick=()=>{restEnd?stopRest():startRest();};

/* ---------- history ---------- */
function renderHistory(){
  app.append(h("h2",{class:"sec"},"History"));
  if(!S.history.length){app.append(h("p",{class:"empty"},"Finished workouts show up here. Log your first sets on the Today tab."));return;}
  [...S.history].sort((a,b)=>b.date.localeCompare(a.date)).forEach(e=>{
    const d=new Date(e.date);
    const card=h("div",{class:"card"},
      h("h3",null,"Cycle "+e.cycle+", week "+e.week+", day "+e.day),
      h("div",{class:"meta"},d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})+(e.pct?", "+e.pct+"%":""))
    );
    e.exercises.forEach(x=>{
      const done=x.log.filter(Boolean);
      const miss=done.length<x.sets||done.some(s=>s.r<x.reps);
      const txt=done.length?x.log.map(s=>s?(s.w===x.w?s.r:s.r+"@"+fmtW(s.w)):"–").join(" / "):"skipped";
      card.append(h("div",{class:"hist-line"},h("span",null,x.ex+(x.heavy?" heavy":"")+" "+fmtW(x.w)),h("span",{class:"r"+(miss?" miss":"")},txt)));
    });
    app.append(card);
  });
}

/* ---------- plan tab ---------- */
function suggestMax(ex){
  // Heaviest weight this cycle where every set of a non-heavy exercise hit 10+ reps.
  let best=null;
  S.history.filter(e=>e.cycle===S.cycle).forEach(e=>e.exercises.forEach(x=>{
    if(x.ex!==ex||x.heavy||x.reps<10)return;
    if(x.log.length<x.sets||x.log.some(s=>!s||s.r<x.reps))return;
    const w=Math.min(...x.log.map(s=>s.w));
    if(best===null||w>best)best=w;
  }));
  return best;
}
function startDraft(){if(!draft)draft={program:clone(S.program),maxes:clone(S.maxes),rest:S.rest};}
function dirty(){return draft&&JSON.stringify({p:draft.program,m:draft.maxes,r:draft.rest})!==JSON.stringify({p:S.program,m:S.maxes,r:S.rest});}
function rerender(){const y=window.scrollY;render();window.scrollTo(0,y);}
function renderSaveBar(){
  let bar=document.getElementById("savebar");
  const show=tab==="plan"&&dirty();
  if(!show){if(bar)bar.remove();return;}
  if(!bar){
    bar=h("div",{class:"savebar",id:"savebar"},h("div",{class:"in"},
      h("span",null,"Unsaved changes"),
      h("button",{class:"btn ghost small",onclick:()=>{draft=null;rerender();}},"Discard"),
      h("button",{class:"btn small",onclick:savePlan},"Save plan")));
    document.body.append(bar);
  }
}
function savePlan(){
  const p=draft.program;
  const used=new Set(p.days.flatMap(d=>d.items.map(i=>i.ex)));
  for(const d of p.days){if(!d.items.length){alert("Day "+d.key+" has no exercises. Add one or remove the day.");return;}}
  for(const ex of used){if(!(ex in draft.maxes)){alert(ex+" is missing from your exercise list.");return;}}
  if(p.ramp.some(x=>!(x>0))){alert("Every week needs a percentage above 0.");return;}
  if(hasLogs()&&!confirm("Saving clears the sets you've ticked in the current workout. Save anyway?"))return;
  S.program=clone(p);S.maxes=clone(draft.maxes);S.rest=draft.rest;
  S.logs={};
  if(S.week>lastWeek())S.week=lastWeek();
  if(!getDay(S.day))S.day=dayKeys()[0];
  draft=null;save();paintTimer();rerender();
}
function nextKey(days){const used=new Set(days.map(d=>d.key));for(const c of "ABCDEFGHIJ")if(!used.has(c))return c;return null;}
function numIn(val,onchg,opts){
  return h("input",Object.assign({class:"num",type:"number",inputmode:"decimal",value:String(val),onchange:e=>{onchg(e.target.value);renderSaveBar();},oninput:e=>{onchg(e.target.value);renderSaveBar();}},opts||{}));
}

function renderPlan(){
  if(cycleFinished())renderReview();else reviewVals=null;
  startDraft();
  const p=draft.program;
  const exNames=Object.keys(draft.maxes);

  app.append(h("h2",{class:"sec"},"Plan"));
  app.append(h("p",{class:"hint"},"Change anything here and tap Save plan. Your history stays as it is."));

  // Weeks
  const wk=h("div",{class:"card"});
  p.ramp.forEach((pct,i)=>{
    wk.append(h("div",{class:"wk-row"},
      h("span",{class:"lbl"},"Week "+(i+1)),
      numIn(pct,v=>{p.ramp[i]=Number(v)||0;},{"aria-label":"Week "+(i+1)+" percent",inputmode:"numeric"}),
      h("span",null,"%")));
  });
  wk.append(h("div",{class:"addrow"},
    h("button",{class:"btn small",onclick:()=>{const last=p.ramp[p.ramp.length-1]||100;p.ramp.push(last+5);rerender();}},"Add week"),
    h("button",{class:"btn ghost small",disabled:p.ramp.length<=1?"disabled":false,onclick:()=>{p.ramp.pop();rerender();}},"Remove last week")));
  wk.append(h("p",{class:"note"},"Percent of your 10-rep max used for the 10-rep sets that week. Add week continues 5% higher."));
  app.append(h("div",{class:"plan-sec"},h("h3",{style:"margin:0 0 6px"},"Weeks in each cycle"),wk));

  // Days
  app.append(h("h3",{style:"margin:0 0 6px"},"Days"));
  p.days.forEach((d,di)=>{
    const card=h("div",{class:"card day-card"},
      h("h3",null,"Day "+d.key,p.days.length>1?h("button",{class:"btn ghost small",onclick:()=>{if(confirm("Remove day "+d.key+"?")){p.days.splice(di,1);rerender();}}},"Remove day"):null));
    d.items.forEach((it,ii)=>{
      const sel=h("select",{"aria-label":"Exercise",onchange:e=>{
        if(e.target.value==="__new"){const n=askNewName();if(n){draft.maxes[n]=0;it.ex=n;}rerender();return;}
        it.ex=e.target.value;rerender();}},
        exNames.map(n=>h("option",{value:n,selected:n===it.ex?"selected":false},n)),
        h("option",{value:"__new"},"New exercise…"));
      card.append(h("div",{class:"it-row"},
        h("div",{class:"it-top"},sel,
          h("button",{class:"heavy-btn","aria-pressed":it.heavy?"true":"false",onclick:()=>{it.heavy=!it.heavy;rerender();}},"Heavy")),
        h("div",{class:"it-bot"},
          numIn(it.sets,v=>{it.sets=Math.max(1,Math.round(Number(v)||1));},{class:"num sm",inputmode:"numeric","aria-label":"Sets"}),
          h("span",{class:"x"},"×"),
          numIn(it.reps,v=>{it.reps=Math.max(1,Math.round(Number(v)||1));},{class:"num sm",inputmode:"numeric","aria-label":"Reps"}),
          h("span",{class:"x"},"reps"),
          h("span",{class:"spacer"}),
          h("button",{class:"icon","aria-label":"Move up",disabled:ii===0?"disabled":false,onclick:()=>{d.items.splice(ii-1,0,d.items.splice(ii,1)[0]);rerender();}},"↑"),
          h("button",{class:"icon","aria-label":"Move down",disabled:ii===d.items.length-1?"disabled":false,onclick:()=>{d.items.splice(ii+1,0,d.items.splice(ii,1)[0]);rerender();}},"↓"),
          h("button",{class:"icon","aria-label":"Remove exercise",onclick:()=>{d.items.splice(ii,1);rerender();}},"✕"))
      ));
    });
    card.append(h("div",{class:"addrow"},h("button",{class:"btn ghost small",onclick:()=>{d.items.push(T(exNames[0]||askNewName()||"New exercise",0,3,10));if(!(d.items[d.items.length-1].ex in draft.maxes))draft.maxes[d.items[d.items.length-1].ex]=0;rerender();}},"Add exercise")));
    app.append(card);
  });
  const nk=nextKey(p.days);
  app.append(h("div",{class:"addrow",style:"margin-bottom:18px"},nk?h("button",{class:"btn small",onclick:()=>{p.days.push({key:nk,items:[T(exNames[0],0,3,10)]});rerender();}},"Add day "+nk):null));

  // Exercises and maxes
  const lib=h("div",{class:"card"});
  const usedIn=n=>p.days.filter(d=>d.items.some(i=>i.ex===n)).map(d=>d.key);
  exNames.forEach(n=>{
    const u=usedIn(n);
    const name=h("input",{class:"txt",value:n,"aria-label":"Exercise name",onchange:e=>{renameEx(n,e.target.value);}});
    lib.append(h("div",{class:"lib-row"},name,
      numIn(draft.maxes[n],v=>{draft.maxes[n]=Math.max(0,Number(v)||0);},{"aria-label":n+" 10-rep max"}),
      h("button",{class:"icon","aria-label":"Delete "+n,disabled:u.length?"disabled":false,title:u.length?"Used on day "+u.join(", "):"",onclick:()=>{if(confirm("Delete "+n+"?")){delete draft.maxes[n];rerender();}}},"✕")));
  });
  lib.append(h("div",{class:"addrow"},h("button",{class:"btn ghost small",onclick:()=>{const n=askNewName();if(n){draft.maxes[n]=0;rerender();}}},"Add exercise")));
  lib.append(h("p",{class:"note"},"Every weight in the plan comes from these 10-rep maxes. You can only delete an exercise once no day uses it."));
  app.append(h("div",{class:"plan-sec"},h("h3",{style:"margin:0 0 6px"},"Exercises and 10-rep maxes"),lib));

  // Settings
  const stepSel=h("select",{"aria-label":"Weight step",onchange:e=>{p.step=Number(e.target.value);rerender();}},
    [5,2.5,1].map(s=>h("option",{value:String(s),selected:p.step===s?"selected":false},String(s))));
  const restSel=h("select",{"aria-label":"Rest time",onchange:e=>{draft.rest=Number(e.target.value);rerender();}},
    [60,90,120,150,180].map(s=>h("option",{value:String(s),selected:draft.rest===s?"selected":false},fmt(s))));
  app.append(h("div",{class:"plan-sec"},h("h3",{style:"margin:0 0 6px"},"Settings"),h("div",{class:"card"},
    h("div",{class:"field"},h("span",null,"Heavy sets, % of the week’s weight"),numIn(p.heavy,v=>{p.heavy=Number(v)||100;},{inputmode:"numeric","aria-label":"Heavy percent"})),
    h("div",{class:"field"},h("span",null,"Round weights to"),stepSel),
    h("div",{class:"field"},h("span",null,"Rest between sets"),restSel)
  )));

  // Backup and reset
  const file=h("input",{type:"file",accept:"application/json,.json",style:"display:none",onchange:importBackup});
  app.append(h("h3",{style:"margin:0 0 6px"},"Backup"));
  app.append(h("div",{class:"card"},
    h("p",{class:"hint",style:"margin-top:0"},"Your log lives only on this phone. Save a backup file now and then, so you don't lose it if you clear your browser data or switch phones."),
    h("div",{class:"field"},h("button",{class:"btn small",onclick:exportBackup},"Save backup"),h("button",{class:"btn ghost small",onclick:()=>file.click()},"Restore backup")),
    file,
    h("div",{class:"field"},h("span",null,"Start over with the original plan (deletes history)"),h("button",{class:"btn ghost small",onclick:()=>{
      if(!confirm("Delete all history and go back to the original 5-week plan?"))return;
      S=freshState();draft=null;save();tab="today";render();
    }},"Reset"))
  ));
  app.append(h("p",{class:"status",style:"margin-bottom:70px"},"Saved on this phone. "+S.history.length+" workout"+(S.history.length===1?"":"s")+" logged."));
}
function askNewName(){
  const n=(prompt("Name of the new exercise")||"").trim();
  if(!n)return null;
  if(n in draft.maxes){alert("You already have "+n+".");return null;}
  return n;
}
function renameEx(oldN,newN){
  newN=(newN||"").trim();
  if(!newN||newN===oldN){rerender();return;}
  if(newN in draft.maxes){alert("You already have "+newN+".");rerender();return;}
  const m={};for(const k of Object.keys(draft.maxes))m[k===oldN?newN:k]=draft.maxes[k];
  draft.maxes=m;
  draft.program.days.forEach(d=>d.items.forEach(i=>{if(i.ex===oldN)i.ex=newN;}));
  rerender();
}
function renderReview(){
  app.append(h("h2",{class:"sec"},"Cycle "+S.cycle+" done"));
  app.append(h("p",{class:"hint"},"Suggestions come from the heaviest 10-rep work you completed this cycle. Edit anything, then start cycle "+(S.cycle+1)+". The plan below carries over, so change it first if you want a different setup next cycle."));
  const card=h("div",{class:"card"});
  if(!reviewVals){reviewVals={};Object.keys(S.maxes).forEach(ex=>{const cur=S.maxes[ex],sug=suggestMax(ex);reviewVals[ex]=sug!==null&&sug>cur?sug:cur;});}
  Object.keys(S.maxes).forEach(ex=>{
    const cur=S.maxes[ex],sug=suggestMax(ex);
    if(!(ex in reviewVals))reviewVals[ex]=cur;
    const inp=h("input",{class:"num",type:"number",inputmode:"decimal",value:String(reviewVals[ex]),"aria-label":ex+" new 10-rep max",oninput:e=>{reviewVals[ex]=Number(e.target.value)||0;}});
    const note=h("span",{class:"sugg"},sug===null?"No complete 10-rep sets, kept at "+fmtW(cur):(sug>cur?"Was "+fmtW(cur)+", you did 10s at "+fmtW(sug):"Kept at "+fmtW(cur)));
    card.append(h("div",{class:"max-row"},h("span",null,ex,note),inp));
  });
  app.append(card);
  app.append(h("button",{class:"btn",style:"width:100%;margin-bottom:10px",onclick:()=>{
    if(!confirm("Start cycle "+(S.cycle+1)+" with these maxes?"))return;
    for(const ex in S.maxes)S.maxes[ex]=Math.max(0,Number(reviewVals[ex])||0);
    reviewVals=null;
    S.cycle++;S.week=1;S.day=dayKeys()[0];S.logs={};draft=null;save();tab="today";render();window.scrollTo(0,0);
  }},"Start cycle "+(S.cycle+1)));
}

/* ---------- backup ---------- */
async function exportBackup(){
  const name="training-log-"+new Date().toISOString().slice(0,10)+".json";
  const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
  try{
    const f=new File([blob],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return;}
  }catch(e){if(e&&e.name==="AbortError")return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
function importBackup(ev){
  const f=ev.target.files&&ev.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const o=migrate(JSON.parse(rd.result));
      if(!o||!Array.isArray(o.history))throw 0;
      if(!confirm("Replace everything on this phone with this backup ("+o.history.length+" workouts)?"))return;
      S=o;draft=null;save();tab="today";render();
    }catch(e){alert("That file isn't a training log backup.");}
  };
  rd.readAsText(f);ev.target.value="";
}

document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{
  if(tab==="plan"&&b.dataset.tab!=="plan"&&dirty()&&!confirm("You have unsaved plan changes. Leave without saving?"))return;
  if(b.dataset.tab!=="plan")draft=null;
  tab=b.dataset.tab;render();window.scrollTo(0,0);
});

loadLocal();
render();
paintTimer();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
})();

</script>
</body>
</html>
